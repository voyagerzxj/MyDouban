# Wiki.js 2 —— 自托管书影音标记站（中文界面，页面即 Markdown，双向同步 GitHub）
# 部署：fnOS Docker → 项目(Compose) → 新建项目 → 粘贴本文件 → 启动
# 首次访问 http://NAS的IP:8020 进入安装向导（语言选「简体中文」）
# GitHub 同步配置见仓库 README.md

services:
  wikijs-db:
    image: postgres:16-alpine
    container_name: wikijs-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=wiki
      - POSTGRES_USER=wikijs
      - POSTGRES_PASSWORD=wikijs_pg_pass_2026   # 仅容器内部网络可见，可自行修改（两处要一致）
      - TZ=Asia/Shanghai
    volumes:
      # 数据库落在 NAS 磁盘上，方便随 fnOS 备份；路径按需调整
      - /vol1/docker/wikijs/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5

  wikijs:
    image: ghcr.io/requarks/wiki:2
    container_name: wikijs
    restart: unless-stopped
    depends_on:
      wikijs-db:
        condition: service_healthy
    environment:
      - DB_TYPE=postgres
      - DB_HOST=wikijs-db
      - DB_PORT=5432
      - DB_USER=wikijs
      - DB_PASS=wikijs_pg_pass_2026
      - DB_NAME=wiki
      - TZ=Asia/Shanghai
    ports:
      - "8020:3000"   # 3000 被 homepage 占用、8010 ryot、8090 watchlist，这里用 8020
